name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site files (web app only, not the Android project)
        run: |
          mkdir -p _site/.well-known
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png README.md _site/
          cp .well-known/assetlinks.json _site/.well-known/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
