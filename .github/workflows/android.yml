name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add repository secrets KEYSTORE_B64 and KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions) before building."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/meter.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/meter.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Read version
        id: v
        run: |
          . android/app/version.properties
          echo "name=$versionName" >> "$GITHUB_OUTPUT"
          echo "code=$versionCode" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "MeterRunning-$versionName.apk"
      - uses: actions/upload-artifact@v4
        with: { name: MeterRunning-apk, path: 'MeterRunning-*.apk' }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Meter Running ${{ steps.v.outputs.name }}
          body: |
            Android app (build ${{ steps.v.outputs.code }}). Download the APK on your phone and open it to install.
            Same signing key as previous releases, so it installs over the old version and keeps your data.
          files: MeterRunning-*.apk
